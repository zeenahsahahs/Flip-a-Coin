<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />

    <title>Flip the coin | devChallenges.io</title>

    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    
    <div id="main">
      <div id="heading">
        <h1>Flip the Coin</h1>
        <h2>Press the coin or the button to flip the coin</h2>
      </div>
      <div id="flip""> <!--Container for the coin and random generator-->
        <div id="heads" class="coin">
          <img id="headsCoin" src="resources/heads.svg" alt="heads">
          <p>HEADS</p>
        </div>
        <div id="tails" class="coin">
          <img id="tailsCoin" src="resources/tails.svg" alt="tails">
          <p>TAILS</p>
        </div>
        <img src="resources/shadow.svg" alt="">
        <p id="sideName"></p>
        <button id="button">Random</button>
      </div>
    </div>

    <div class="author-info">
      Coded by <a href="#">Shaha</a> | Challenge by
      <a href="https://www.devchallenges.io?ref=challenge" target="_blank"
        >devChallenges.io</a
      >.
    </div>
    <script src="script.js"></script>
  </body>
</html>
